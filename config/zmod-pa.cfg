# Экспериментальная Auto PA только для AD5M / AD5M Pro.
# Не подключать к C5 / AD5X. Требуется обновлённый MCU.
[zmod_pa]
model: AD5M

[gcode_macro TEST_PA]
description: Experimental automatic PA calibration
gcode:
    ZMOD_AUTO_PA {rawparams}

[gcode_macro TEST_PA_EMPTY]
description: Calibrate empty extruder (CONFIRM=1)
gcode:
    ZMOD_AUTO_PA_EMPTY {rawparams}
